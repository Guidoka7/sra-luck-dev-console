name: Guardian scan (horário)

# Dispara a varredura do Dev Console de hora em hora (o cron da Vercel Hobby
# só roda 1x/dia). É o que alimenta os gráficos de histórico da Visão Geral.
# Precisa dos secrets DEV_CONSOLE_URL e CRON_SECRET no repositório; sem eles,
# o job apenas avisa e termina sem erro.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: guardian-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar varredura
        env:
          URL: ${{ secrets.DEV_CONSOLE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets DEV_CONSOLE_URL/CRON_SECRET ausentes: varredura horária desativada."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${URL%/}/api/infra-scan" -o /dev/null -w "HTTP %{http_code}\n"
